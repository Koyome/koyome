<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title_home">Koyome · a quiet corner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23c9c7c2' stroke-width='1.5'/><circle cx='16' cy='16' r='4' fill='%239e2b25'/></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="home" data-title-key="title_home">

  <!-- page transition veil: hexagram sigil, plays when leaving for another page -->

  <!-- Loading curtain -->
  <div class="loader" id="loader">
    <svg viewBox="0 0 200 200" fill="none">
      <circle cx="100" cy="100" r="92" stroke="#8b8985" stroke-width="1" stroke-dasharray="1.5 8" opacity="0.8"/>
      <circle cx="100" cy="100" r="66" stroke="#8b8985" stroke-width="1" opacity="0.7"/>
      <polygon points="100,42 152,131 48,131" stroke="#8b8985" stroke-width="1.2"/>
      <polygon points="100,158 152,69 48,69" stroke="#8b8985" stroke-width="1.2"/>
      <circle cx="100" cy="100" r="5" fill="#9e2b25"/>
      <circle cx="100" cy="100" r="11" stroke="#9e2b25" stroke-width="1.2"/>
    </svg>
    <div class="loader-word" data-i18n="loader_word">ENTERING KOYOME...</div>
    <div class="loader-bar"><i id="loaderFill"></i></div>
    <div class="loader-num" id="loaderNum">000</div>
  </div>

  <header class="site-header" id="siteHeader"></header>

  <main class="home">
    <figure class="portrait">
      <span class="portrait-dot" aria-hidden="true"></span>
      <div class="portrait-box">
        <img id="portraitImg" src="assets/avatar.jpg" alt="Koyome" />
      </div>
      <figcaption data-i18n="home_fig">FIG. 01 — KOYOME</figcaption>
    </figure>

    <div class="home-text">
      <p class="eyebrow" data-i18n="home_eyebrow">WELCOME</p>
      <h1 class="home-name" id="homeName">Koyome</h1>
      <p class="home-tagline" id="homeTagline"></p>
      <div class="home-intro" id="homeIntro"></div>
      <nav class="home-links">
        <a href="catalog.html"><span data-i18n="nav_catalog">Catalog</span><em>→</em></a>
        <a href="guestbook.html"><span data-i18n="nav_guestbook">Guestbook</span><em>→</em></a>
      </nav>
    </div>
  </main>

  <!-- Catalog preview — the heart of the site, given real estate on the home page -->
  <section class="home-catalog" aria-label="Catalog">
    <div class="section-head">
      <span class="zh" data-i18n="sec_catalog">Catalog</span>
      <span class="en" data-i18n="sec_catalog_en">INDEX</span>
      <span class="count" id="homeCatCount"></span>
    </div>
    <div class="home-catalog-list" id="homeCatList"></div>
    <a class="home-catalog-more" href="catalog.html"><span data-i18n="home_catalog_more">OPEN FULL CATALOG</span><em>→</em></a>
  </section>

  <!-- Hexagram sigil — the old friend, back on the homepage -->
  <section class="home-sigil" aria-hidden="true">
    <span class="sigil-rule"></span>
    <div class="sigil">
      <svg class="sigil-svg" viewBox="0 0 400 400" fill="none">
        <g class="sigil-spin-a">
          <circle cx="200" cy="200" r="186" stroke="#b3b0aa" stroke-width="1" stroke-dasharray="1.5 9"/>
        </g>
        <circle cx="200" cy="200" r="150" stroke="#c6c3bd" stroke-width="1"/>
        <!-- chords weaving the six nodes together -->
        <g stroke="#cdCAC2" stroke-width="0.7" opacity="0.9">
          <line x1="200" y1="50" x2="329.9" y2="275"/>
          <line x1="200" y1="50" x2="70.1" y2="275"/>
          <line x1="200" y1="350" x2="329.9" y2="125"/>
          <line x1="200" y1="350" x2="70.1" y2="125"/>
          <line x1="329.9" y1="125" x2="70.1" y2="275"/>
          <line x1="70.1" y1="125" x2="329.9" y2="275"/>
        </g>
        <g class="sigil-spin-b">
          <polygon points="200,50 329.9,275 70.1,275" stroke="#a3a09a" stroke-width="1.1"/>
          <circle cx="200" cy="50" r="4" fill="#c9c7c2"/>
          <circle cx="329.9" cy="275" r="4" fill="#c9c7c2"/>
          <circle cx="70.1" cy="275" r="4" fill="#c9c7c2"/>
        </g>
        <g class="sigil-spin-c">
          <polygon points="200,350 329.9,125 70.1,125" stroke="#a3a09a" stroke-width="1.1"/>
          <circle cx="200" cy="350" r="4" fill="#c9c7c2"/>
          <circle cx="329.9" cy="125" r="4" fill="#c9c7c2"/>
          <circle cx="70.1" cy="125" r="4" fill="#c9c7c2"/>
        </g>
        <circle class="sigil-pulse" cx="200" cy="200" r="4" fill="#9e2b25"/>
      </svg>
      <span class="sigil-name flicker" id="sigilName">Koyome</span>
      <span class="twinkle" style="left:12%; top:18%; animation-delay:0s;"></span>
      <span class="twinkle" style="left:86%; top:26%; animation-delay:1.4s;"></span>
      <span class="twinkle" style="left:8%; top:66%; animation-delay:2.6s;"></span>
      <span class="twinkle" style="left:90%; top:72%; animation-delay:0.9s;"></span>
      <span class="twinkle" style="left:26%; top:88%; animation-delay:3.4s;"></span>
      <span class="twinkle" style="left:68%; top:8%; animation-delay:2s;"></span>
    </div>
    <span class="sigil-rule"></span>
  </section>

  <footer class="site-footer">
    <span data-i18n="footer">© 2026 KOYOME. ALL RIGHTS RESERVED.</span> &nbsp;·&nbsp; <span class="addr">KOYOME.ME</span>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/header.js"></script>
  <script src="js/data.js"></script>
  <script src="js/deco.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
